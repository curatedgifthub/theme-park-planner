<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <title>Walt Disney World Trip Planner</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Pick a park, pick who you're travelling with, and get a full day plan for Walt Disney World — heat, crowds and closures included. An unofficial planning guide.">

    <!-- Link previews.
         og:title and og:description work as-is and need no URL.

         og:image DOES need one. The Open Graph spec requires an absolute URL:
         Facebook and LinkedIn reject relative paths outright and other scrapers
         are inconsistent, so the card below will not render until the two
         og:image / twitter:image lines carry the real published origin.

         That origin does not exist yet — it depends on the repo name, which is
         still open (Q1). When the repo is created, replace https://curatedgifthub.github.io/theme-park-planner
         in both lines with e.g. https://curatedgifthub.github.io/<repo>
         `npm run verify` FAILS while the placeholder is present, so this cannot
         be forgotten and cannot ship half-done. -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Walt Disney World Trip Planner">
    <meta property="og:description" content="A choose-your-own-adventure planning tool. Pick a park and who you're travelling with, and get a day plan built around the heat, the crowds and what's actually closed.">
    <meta property="og:image" content="https://curatedgifthub.github.io/theme-park-planner/assets/share-card.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Walt Disney World Trip Planner">
    <meta name="twitter:description" content="A choose-your-own-adventure planning tool for Walt Disney World. Unofficial.">
    <meta name="twitter:image" content="https://curatedgifthub.github.io/theme-park-planner/assets/share-card.png">

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <meta name="theme-color" content="#fdfcfa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#15171b" media="(prefers-color-scheme: dark)">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="outerContainer">
        <h3 class="written-in-ink"><a href="https://www.inklestudios.com/ink">WRITTEN IN INK</a></h3>

        <div id="controls" class="buttons">
          <a id="rewind" title="Restart story from beginning">restart</a>
          <a id="save" title="Save progress">save</a>
          <a id="reload" title="Reload from save point">load</a>
          <a id="theme-switch" title="Switch theme">theme</a>
        </div>

        <div id="story" class="container">
            <div class="header">
                <h1>Walt Disney World Trip Planner</h1>
                <h2 class="byline"></h2>
            </div>
        </div>

        <!-- Task 1.13. This sits OUTSIDE #story on purpose: main.js's removeAll()
             only queries inside #story, so a footer here survives every page turn,
             every "restart", and every CLEAR tag. It is therefore on all 217 pages.
             `data-verified` is read by tools/verify.js, which fails the build when
             the date is more than 180 days old. Update both together.
             The affiliation disclaimer and the "confirm before you book" warning
             live in the story's opening paragraph, not here — repeating them in the
             footer put both on screen twice. -->
        <footer class="site-footer" data-verified="2026-08-31">
            <p class="footer-verified">
                Facts last checked against Disney's published information on
                <time datetime="2026-08-31">31 August 2026</time>.
            </p>
        </footer>
    </div>

    <script src="ink.js"></script>
    <script src="story.js"></script>
    <script src="main.js"></script>
</body>
</html>
